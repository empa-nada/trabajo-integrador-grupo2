<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deadstar.diary</title>
    <link rel="stylesheet" href="emo.css">
</head>
<body>

    <nav class="top-nav">
        <button type="button" class="menu-hamburguesa" aria-label="Menú" aria-expanded="false">☰</button>
        <div class="nav-links">
            <a href="index.html" class="active">Publicaciones</a>
            <a href="contacto.html">Contacto</a>
        </div>
    </nav>

    <header class="site-header">
        <h1>deadstar.diary</h1>
        <p class="site-subtitle">Lost in my own little universe ♡</p>
    </header>

    <!-- Contenedor donde aparecerán los posts -->
    <main id="blogPosts"></main>

    <script>
        const blogPostsContainer = document.getElementById('blogPosts');

        // Menú hamburguesa (celulares)
        const menuBtn = document.querySelector('.menu-hamburguesa');
        const navLinks = document.querySelector('.nav-links');
        menuBtn.addEventListener('click', function () {
            const open = navLinks.classList.toggle('open');
            menuBtn.setAttribute('aria-expanded', open);
        });

        // Cargar publicaciones
        document.addEventListener('DOMContentLoaded', loadPosts);

        function getPosts() {
            try {
                const posts = JSON.parse(localStorage.getItem('myBlogPosts') || '[]');
                return Array.isArray(posts) ? posts : [];
            } catch (error) {
                return [];
            }
        }

        function renderPost(post) {
            const postArticle = document.createElement('article');
            postArticle.className = 'post';

            const title = document.createElement('h2');
            title.textContent = post.title;

            const date = document.createElement('p');
            date.className = 'post-date';
            date.textContent = 'Publicado el: ' + post.date;

            const content = document.createElement('p');
            content.className = 'post-content';
            content.textContent = post.content;

            postArticle.append(title, date, content);
            blogPostsContainer.appendChild(postArticle);
        }

        function loadPosts() {
            const posts = getPosts();
            blogPostsContainer.replaceChildren();

            if (posts.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'empty-state';
                empty.textContent = 'Aún no hay publicaciones disponibles.';
                blogPostsContainer.appendChild(empty);
                return;
            }

            // Las más nuevas primero (admin las guarda con unshift)
            posts.forEach(renderPost);
        }

        // Escucha cambios en tiempo real si se publica algo desde otra pestaña
        window.addEventListener('storage', loadPosts);
    </script>
</body>
</html>
