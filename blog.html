<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deadstar.diary</title>
    <link rel="stylesheet" href="emo.css">
</head>
<body>

    <!-- Barra de navegación con menú hamburguesa -->
    <nav class="top-nav">
        <button type="button" class="menu-hamburguesa" aria-label="Menú" aria-expanded="false">☰</button>
        <div class="nav-links">
            <a href="blog.html" class="active">Publicaciones</a>
            <a href="contact.html">Contacto</a>
            <a href="admin.html">Administrar</a>
        </div>
    </nav>

    <!-- Encabezado principal del diario -->
    <header class="site-header">
        <h1>deadstar.diary</h1>
        <p class="site-subtitle">Lost in my own little universe ♡</p>
    </header>

    <!-- Contenedor donde JavaScript inyecta los posts guardados -->
    <main id="blogPosts"></main>

    <!-- Pie de página (Footer) -->
    <footer class="site-footer">
        <p><span>✦</span> deadstar.diary — Grupo 2 <span>✦</span></p>
        <p>Alonso Arrigo • Cravero Sierra • Monayar • Patiño Marín • Sanchez</p>
    </footer>

    <script>
        const blogPostsContainer = document.getElementById('blogPosts');

        // Lógica del botón hamburguesa: agrega o quita la clase 'open' para mostrar/ocultar los enlaces
        const menuBtn = document.querySelector('.menu-hamburguesa');
        const navLinks = document.querySelector('.nav-links');
        menuBtn.addEventListener('click', function () {
            const open = navLinks.classList.toggle('open');
            menuBtn.setAttribute('aria-expanded', open);
        });

        // Ejecuta la carga de publicaciones apenas termina de cargar el HTML
        document.addEventListener('DOMContentLoaded', loadPosts);

        // Lee las publicaciones guardadas en el navegador (localStorage)
        function getPosts() {
            try {
                const posts = JSON.parse(localStorage.getItem('myBlogPosts') || '[]');
                return Array.isArray(posts) ? posts : [];
            } catch (error) {
                return [];
            }
        }

        // Crea la tarjeta HTML de cada publicación individual
        function renderPost(post) {
            const postArticle = document.createElement('article');
            postArticle.className = 'post';

            const title = document.createElement('h2');
            title.textContent = post.title;

            const date = document.createElement('p');
            date.className = 'post-date';
            date.textContent = 'Publicado el: ' + post.date;

            const content = document.createElement('p');
            content.className = 'post-content';
            content.textContent = post.content;

            postArticle.append(title, date, content);
            blogPostsContainer.appendChild(postArticle);
        }

        // Muestra todos los posts o un mensaje si el blog está vacío
        function loadPosts() {
            const posts = getPosts();
            blogPostsContainer.replaceChildren();

            if (posts.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'empty-state';
                empty.textContent = 'Aún no hay publicaciones disponibles.';
                blogPostsContainer.appendChild(empty);
                return;
            }

            posts.forEach(renderPost);
        }

        // Actualiza automáticamente si se publica algo desde admin.html en otra pestaña
        window.addEventListener('storage', loadPosts);
    </script>
</body>
</html>
